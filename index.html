<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSEN 5151 - Lab 0 Item #5 Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>SYSEN 5151 Readiness Check Item #5</h2>
        <p>点击下方按钮测试前端 UI 与 Python 本地 API 的连通性：</p>
        <button onclick="fetchApiData()">调用 API</button>
        <div id="result">等待点击...</div>
    </div>

    <script>
        async function fetchApiData() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "正在请求 API 数据...";
            try {
                // 向本地 FastAPI 后端发起 HTTP GET 请求
                const response = await fetch('http://127.0.0.1:8000/api/hello');
                const data = await response.json();
                
                // 将后端返回的 JSON 数据渲染展示到前端页面
                resultDiv.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.innerText = "请求失败，请确保后端 uvicorn 服务在 8000 端口正确运行。错误：" + error;
            }
        }
    </script>
</body>
</html>
