<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSEN 5151 - Lab 0 Item #5 Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
   <div class="container">
        <h2>SYSEN 5151 Readiness Check Item #5</h2>
        <p>Click the button below to test connectivity between the frontend UI and the local Python API:</p>
        <button onclick="fetchApiData()">Call API</button>
        <div id="result">Waiting for click...</div>
    </div>

<script>
    async function fetchApiData() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerText = "Requesting API data...";
        try {
            // Send an HTTP GET request to the local FastAPI backend
            const response = await fetch('http://127.0.0.1:8000/api/hello');
            const data = await response.json();

            // Render the JSON data returned from the backend onto the frontend page
            resultDiv.innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            resultDiv.innerText = "Request failed. Please ensure the backend uvicorn service is running correctly on port 8000. Error: " + error;
        }
    }
</script>
</body>
</html>
